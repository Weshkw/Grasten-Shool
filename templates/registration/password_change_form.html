{% extends "base.html" %}

{% block title %}Change password · Grasten Academy{% endblock %}

{% block content %}
<section class="card form-card">
    <h1>Change your password</h1>
    <p class="muted">Choose a new password, especially if the school office gave you a temporary one.</p>
    <form method="post" class="stacked-form">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit" class="button button-primary button-block">Change password</button>
    </form>
</section>
{% endblock %}
